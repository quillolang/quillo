[package]
name = "quillo"
version = "0.4.0"
edition = "2021"
description = "Quillo: a small web language where routes, payload patterns, HTML and browser components are part of the syntax"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "quillo"
path = "src/main.rs"

[dependencies]
indexmap = "2"
stacker = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
fastrand = "2"
flate2 = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
bytes = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
