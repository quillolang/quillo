[package]
name = "quillo"
version = "0.2.0"
edition = "2021"
description = "Quillo: a small web language where routes, payload patterns, HTML and browser components are part of the syntax"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "quillo"
path = "src/main.rs"

[dependencies]
indexmap = "2"
stacker = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
fastrand = "2"
flate2 = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
