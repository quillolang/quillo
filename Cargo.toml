[package]
name = "quillo"
version = "0.5.0"
edition = "2021"
description = "Quillo: a small web language where routes, payload patterns, HTML and browser components are part of the syntax"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "quillo"
path = "src/main.rs"

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
httparse = "1"
corosensei = "0.3"
psm = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-postgres = "0.7"
indexmap = "2"
stacker = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
ureq = "2"
fastrand = "2"
getrandom = "0.2"
flate2 = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
bytes = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# `quillo app`: the program in a native window (see src/desktop.rs).
wry = { version = "0.57", optional = true, features = ["devtools"] }
tao = { version = "0.37", optional = true }

# The macOS menu bar, without which copy and paste do not work in the window.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", optional = true }

[features]
app = ["dep:wry", "dep:tao", "dep:muda"]
