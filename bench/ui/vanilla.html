<!doctype html>
<html>
<head><meta charset="utf-8"><title>Vanilla keyed</title></head>
<body>
<!-- The same app in plain JavaScript, as js-framework-benchmark's
     vanillajs-keyed does it: a cloned row template, rows kept by id, the
     selected row's class changed directly. What Quillo is measured against. -->
<div class="container">
  <div class="jumbotron"><div class="row">
    <div class="col-md-6"><h1>Vanilla keyed</h1></div>
    <div class="col-md-6"><div class="row">
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="run">Create 1,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="runlots">Create 10,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="add">Append 1,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="update">Update every 10th row</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="clear">Clear</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="swaprows">Swap Rows</button></div>
    </div></div>
  </div></div>
  <table class="table table-hover table-striped test-data"><tbody id="tbody"></tbody></table>
</div>
<script>
const ADJ = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
const COLOR = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "brown", "white", "black", "orange"];
const NOUN = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];
const label = (i) => `${ADJ[(i * 7) % ADJ.length]} ${COLOR[(i * 13) % COLOR.length]} ${NOUN[(i * 17) % NOUN.length]}`;
let next = 1, data = [], rows = [], selected = null;
const tbody = document.getElementById("tbody");
const tpl = document.createElement("template");
tpl.innerHTML = '<tr><td class="col-md-1"> </td><td class="col-md-4"><a class="lbl"> </a></td><td class="col-md-1"><a class="remove"><span class="remove glyphicon glyphicon-remove" aria-hidden="true"></span></a></td><td class="col-md-6"></td></tr>';
const rowTpl = tpl.content.firstChild;
function build(n) { const d = new Array(n); for (let i = 0; i < n; i++) { d[i] = { id: next, label: label(next) }; next++; } return d; }
function makeRow(d) {
  const tr = rowTpl.cloneNode(true), td1 = tr.firstChild, a = td1.nextSibling.firstChild;
  tr.data_id = d.id; td1.firstChild.nodeValue = d.id; a.firstChild.nodeValue = d.label;
  return tr;
}
function append(d) { const f = document.createDocumentFragment(); for (const x of d) { const tr = makeRow(x); rows.push(tr); f.appendChild(tr); } tbody.appendChild(f); }
function clear() { tbody.textContent = ""; rows = []; data = []; selected = null; }
const on = (id, f) => document.getElementById(id).addEventListener("click", f);
on("run", () => { clear(); data = build(1000); append(data); });
on("runlots", () => { clear(); data = build(10000); append(data); });
on("add", () => { const d = build(1000); data = data.concat(d); append(d); });
on("update", () => { for (let i = 0; i < data.length; i += 10) { data[i].label += " !!!"; rows[i].childNodes[1].firstChild.firstChild.nodeValue = data[i].label; } });
on("clear", clear);
on("swaprows", () => {
  if (data.length <= 998) return;
  const a = rows[1], b = rows[998], after = b.nextSibling;
  tbody.insertBefore(b, a); tbody.insertBefore(a, after);
  [data[1], data[998]] = [data[998], data[1]]; [rows[1], rows[998]] = [rows[998], rows[1]];
});
tbody.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  const tr = a.closest("tr"), i = rows.indexOf(tr);
  if (a.classList.contains("lbl")) { if (selected) selected.className = ""; tr.className = "danger"; selected = tr; }
  else { tr.remove(); rows.splice(i, 1); data.splice(i, 1); if (selected === tr) selected = null; }
});
</script>
</body>
</html>
