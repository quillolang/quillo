<!doctype html>
<!-- The wide Quillo banners: profile and channel headers. The format is the
     URL's hash (#youtube, #x, #reddit, #reddit-mobile); each keeps its text where
     that site never crops or covers it. Render with brand/render-banner.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Instrument Serif"; src: url("../site/public/fonts/instrument-serif.woff2") format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../site/public/fonts/instrument-serif-italic.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../site/public/fonts/inter.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; src: url("../site/public/fonts/jetbrains-mono.woff2") format("woff2"); }

:root {
  --ink: #0b0a12;
  --line: #262435;
  --text: #ecebf3;
  --muted: #a3a0b7;
  --faint: #8b88a0;
  --gold: #f3b54a;
  --violet: #b9a8ff;
}
html, body { margin: 0; height: 100%; }
body {
  position: relative; overflow: hidden; color: var(--text); font-family: "Inter", sans-serif;
  background:
    radial-gradient(60% 120% at 8% 110%, rgba(243, 181, 74, .22), transparent 70%),
    radial-gradient(55% 120% at 94% -15%, rgba(185, 168, 255, .20), transparent 70%),
    var(--ink);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* The lockup: the logo and name, the headline, the address. */
.lockup { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
.brand { display: flex; align-items: center; gap: .45em; font-weight: 600; letter-spacing: -.01em; }
.brand svg { width: 1.5em; height: 1.5em; }
h1 { margin: 0; font-family: "Instrument Serif", serif; font-weight: 400; line-height: 1; letter-spacing: -.015em; white-space: nowrap; }
h1 em {
  font-style: italic; padding-right: .04em;
  background: linear-gradient(100deg, var(--gold), #f7d38c 45%, var(--violet));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { font-family: "JetBrains Mono", monospace; color: var(--faint); white-space: nowrap; }
.sub b { color: var(--gold); font-weight: 400; }
.rule { display: none; }

/* YouTube 2560×1440: everything inside the 1546×423 middle every device shows. */
.youtube .lockup { left: 50%; top: 50%; width: 1546px; height: 423px; transform: translate(-50%, -50%); justify-content: center; gap: 26px; }
.youtube .brand { font-size: 46px; }
.youtube h1 { font-size: 150px; }
.youtube .sub { font-size: 30px; }

/* X 1500×500: the profile photo covers the lower left, so the text sits right of center. */
.x .lockup { left: 380px; right: 70px; top: 0; bottom: 0; justify-content: center; gap: 22px; }
.x .brand { font-size: 34px; }
.x h1 { font-size: 104px; }
.x .sub { font-size: 22px; }

/* Reddit desktop 4000×192: one row, centered; narrower screens crop the sides. */
.reddit .lockup { inset: 0; flex-direction: row; justify-content: center; gap: 44px; }
.reddit .brand { font-size: 46px; }
.reddit h1 { font-size: 84px; padding-bottom: 8px; }
.reddit .sub { font-size: 26px; }
.reddit .rule { display: block; width: 1px; height: 76px; background: var(--line); }

/* Reddit mobile 1600×480: the community's icon sits over the bottom left. */
.reddit-mobile .lockup { left: 0; right: 0; top: 0; bottom: 70px; justify-content: center; gap: 22px; }
.reddit-mobile .brand { font-size: 38px; }
.reddit-mobile h1 { font-size: 112px; }
.reddit-mobile .sub { font-size: 24px; }
</style>
</head>
<body>
<canvas></canvas>
<div class="lockup">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#f3b54a"/><stop offset="1" stop-color="#b9a8ff"/></linearGradient></defs>
      <rect x=".5" y=".5" width="31" height="31" rx="7" fill="#0b0a12" stroke="#262435"/>
      <path d="M27 4C16 5 9.2 11.8 7.5 21.6L6 27.6l1.6.4 1.6-4.7C19 22.7 25.6 14.9 27 4z" fill="url(#g)"/>
      <path d="M9.2 23.3C12.4 17.6 17 12.6 23 8.5" fill="none" stroke="#0b0a12" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    Quillo
  </div>
  <div class="rule"></div>
  <h1>The web, <em>as a language.</em></h1>
  <div class="rule"></div>
  <div class="sub"><b>quillolang.org</b> · github.com/quillolang/quillo</div>
</div>
<script>
// The Game of Life board from the site's hero: a faint grid, a few cells lit,
// kept away from the text. Seeded, so every render is the same.
// Each format's size, set here rather than read from the window, which
// headless Chrome may resize after the page has drawn.
const SIZES = { youtube: [2560, 1440], x: [1500, 500], reddit: [4000, 192], "reddit-mobile": [1600, 480] };
const format = SIZES[location.hash.slice(1)] ? location.hash.slice(1) : "youtube";
const [w, h] = SIZES[format];
document.body.className = format;
document.body.style.width = w + "px"; document.body.style.height = h + "px";
document.fonts.ready.then(draw);

function draw() {
const c = document.querySelector("canvas"), dpr = devicePixelRatio, cell = h < 300 ? 24 : 32;
c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
const g = c.getContext("2d"); g.scale(dpr, dpr);
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rects = [...document.querySelectorAll(".brand, h1, .sub")].map((e) => e.getBoundingClientRect());
const text = {
  left: Math.min(...rects.map((r) => r.left)), right: Math.max(...rects.map((r) => r.right)),
  top: Math.min(...rects.map((r) => r.top)), bottom: Math.max(...rects.map((r) => r.bottom)),
};
const pad = cell * 2;
for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
  g.strokeStyle = "rgba(236, 235, 243, .045)"; g.lineWidth = 1;
  g.strokeRect(x + .5, y + .5, cell, cell);
  const nearText = x + cell > text.left - pad && x < text.right + pad && y + cell > text.top - pad && y < text.bottom + pad;
  if (!nearText && rand() < (w * h > 2e6 ? .07 : .1)) {
    const t = x / w;
    g.fillStyle = `rgba(${Math.round(243 - 58 * t)}, ${Math.round(181 - 13 * t)}, ${Math.round(74 + 181 * t)}, ${.10 + rand() * .16})`;
    g.beginPath(); g.roundRect(x + 3, y + 3, cell - 5, cell - 5, 4); g.fill();
  }
}
}
</script>
</body>
</html>
