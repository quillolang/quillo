name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build --release
      - name: Tests (the browser test uses the runner's Chrome)
        run: cargo test
      - name: Check the examples
        run: for f in examples/*.qwe; do ./target/release/quillo check "$f"; done
      - name: VS Code extension
        working-directory: editors/vscode
        run: npm ci && npm test && npx vsce package --skip-license
