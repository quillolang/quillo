name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 24: its CLDR (47) is the one money's locale table was made from, which
      # tests/money.rs compares with Intl.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # tests/postgres.rs and tests/mysql.rs start servers of their own from these
      # binaries, and skip without them.
      - name: PostgreSQL and MariaDB for the tests
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql mariadb-server
          echo "QUILLO_TEST_PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mariadb"
          ln -s "$(command -v mariadbd || echo /usr/sbin/mariadbd)" "$(command -v mariadb-install-db)" "$RUNNER_TEMP/mariadb/"
          echo "QUILLO_TEST_MYSQL_BIN=$RUNNER_TEMP/mariadb" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: The environment check, and the sample app it runs
        run: sh scripts/doctor.sh --build
      - name: Tests (the browser test uses the runner's Chrome)
        run: cargo test
      - name: Check the sample app and the test programs
        run: for f in app/*.qwe tests/programs/*.qwe; do ./target/release/quillo check "$f"; done

  # scripts/doctor.ps1, run as a Windows user would: in Windows PowerShell 5.1,
  # then the check alone in PowerShell 7.
  doctor-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The environment check, and the sample app it runs
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\doctor.ps1 -Build
      - name: The check in PowerShell 7
        shell: pwsh
        run: ./scripts/doctor.ps1

  # Known vulnerabilities, licences and sources of dependencies (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # `quillo app` (the native window) builds on each desktop platform.
  app:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build with windows
        run: cargo build --features app
      - name: Test the window's own code
        run: cargo test --features app --bin quillo
