name: Release

# Pushing a version tag (git tag v0.5.0 && git push origin v0.5.0) builds
# quillo for each system and attaches the binaries to that tag's GitHub
# Release, so people can download one instead of building it. The repository
# itself keeps only the source: target/ stays ignored.

on:
  push:
    tags: ["v*"]
  # A release's binaries again, from its tag's source: all of them, or the one `target` names
  # (a build that failed, or one this workflow could not make when the tag was pushed).
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, as v0.7.0"
        required: true
      target:
        description: "Only this target (empty: all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The release, with the CHANGELOG's section for it as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub's own notes list pull requests, which this repository has none of: v0.7.0's
        # page said nothing but a link (the user: "imagine finding only this").
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section \"## $version\"" >&2; exit 1; fi
          printf '\n\n[The whole changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Quillo $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  build:
    needs: release
    # Also when `release` was skipped (a run by hand, for a release already made).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linked against glibc 2.17 with zig, so that it runs on old systems too: the shared
          # servers of CloudLinux 7 and CentOS 7 have 2.17, and the oldest Ubuntu runner 2.35.
          # Still glibc, not musl: a plugin (.qwer) is a library it loads (FEEDBACK41.md,
          # Q-424; branch feedback40-43).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, runs: true, glibc: "2.17" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, runs: true, glibc: "2.17" }
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          # Intel Macs: built on the same runner, for the other processor.
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, runs: true }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GO: ${{ inputs.target == '' || inputs.target == matrix.target }}
    steps:
      - uses: actions/checkout@v7
        if: env.GO == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.GO == 'true'
        with:
          targets: ${{ matrix.target }}
      - name: zig, to link against an old glibc
        if: env.GO == 'true' && matrix.glibc
        # 0.19.8 passed newer Rust's `-Wl,--fix-cortex-a53-843419` to zig, which refused it, and
        # the Linux ARM build of v0.7.0 failed; later ones leave it out.
        run: |
          pip install ziglang==0.13.0
          cargo install cargo-zigbuild --version 0.24.1 --locked
      - name: Build
        if: ${{ env.GO == 'true' && !matrix.glibc }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build, for glibc ${{ matrix.glibc }}
        if: env.GO == 'true' && matrix.glibc
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}
      - name: It starts
        if: env.GO == 'true' && matrix.runs
        shell: bash
        run: target/${{ matrix.target }}/release/quillo --version
      - name: It starts on CentOS 7 (glibc 2.17) and checks a program
        if: env.GO == 'true' && matrix.glibc
        run: |
          objdump -T target/${{ matrix.target }}/release/quillo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          printf 'route GET / = "hi"\nprint("ran")\n' > /tmp/hi.qwe
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/q" -v /tmp:/w centos:7 sh -c '/q/quillo --version && /q/quillo check /w/hi.qwe' 
      - name: Package, with its SHA-256, and attach to the release
        if: env.GO == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="quillo-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/quillo.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            file="$name.zip"
          else
            cp target/${{ matrix.target }}/release/quillo "$name"/
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          gh release upload "$TAG" "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --clobber
